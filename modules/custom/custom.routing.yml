ajax.content:
  # More information on parameters:
  # https://www.drupal.org/node/2186285
  path: '/ajax/{tcType}/{tnNodeID}'
  defaults:
    _controller: '\Drupal\custom\Controller\AjaxController::getContent'
    # For the breadcrumb block which I am disabling. However, if you don't
    # have the default value, then the site crashes.
    # Uncaught PHP Exception Symfony\\Component\\Routing\\Exception\\MissingMandatoryParametersException:
    # "Some mandatory parameters are missing ("tcCustomCategory") to generate a URL for route "custom.content"."
    # at /var/www/peterbouteneff.com/public_html/core/lib/Drupal/Core/Routing/UrlGenerator.php line 180
    tcType: 'xml'
    tnNodeID: 0
  requirements:
    _permission: 'access content'
    # Only allow alpha, digits, underlines & dashes.
    tcType: ^[a-zA-Z0-9_-]+
    tnNodeID: ^[0-9]+

admin.routine:
  path: '/admin/custom/{tcTask}'
  defaults:
    _controller: '\Drupal\custom\Controller\AdminController::runTask'
  requirements:
    _role: 'maintenance_user'
    # Only allow alpha, digits, underlines & dashes.
    tcTask: ^[a-zA-Z0-9_-]+

all.blogs.content:
  # More information on parameters:
  # https://www.drupal.org/node/2186285
  path: '/view/all-blogs'
  defaults:
    _controller: '\Drupal\custom\Controller\AllBlogsController::getContent'
    _title_callback: '\Drupal\custom\Controller\AllBlogsController::getTitle'
    # For the breadcrumb block which I am disabling. However, if you don't
    # have the default value, then the site crashes.
    # Uncaught PHP Exception Symfony\\Component\\Routing\\Exception\\MissingMandatoryParametersException:
    # "Some mandatory parameters are missing ("tcCustomCategory") to generate a URL for route "custom.content"."
    # at /var/www/peterbouteneff.com/public_html/core/lib/Drupal/Core/Routing/UrlGenerator.php line 180
  requirements:
    _permission: 'access content'

all.wow.content:
  # More information on parameters:
  # https://www.drupal.org/node/2186285
  path: '/view/all-wow'
  defaults:
    _controller: '\Drupal\custom\Controller\AllWOWController::getContent'
    _title_callback: '\Drupal\custom\Controller\AllWOWController::getTitle'
    # For the breadcrumb block which I am disabling. However, if you don't
    # have the default value, then the site crashes.
    # Uncaught PHP Exception Symfony\\Component\\Routing\\Exception\\MissingMandatoryParametersException:
    # "Some mandatory parameters are missing ("tcCustomCategory") to generate a URL for route "custom.content"."
    # at /var/www/peterbouteneff.com/public_html/core/lib/Drupal/Core/Routing/UrlGenerator.php line 180
  requirements:
    _permission: 'access content'
