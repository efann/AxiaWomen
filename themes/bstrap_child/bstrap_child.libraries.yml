jquery.ui:
  remote: https://jqueryui.com/
  license:
    name: MIT License
    url: https://tldrlegal.com/license/mit-license
    gpl-compatible: true
  js:
    //ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js: { type: external, minified: true }
  css:
    component:
      css/jquery-ui-1.12.1/jquery-ui.css: {}

beo.routines:
  remote: https://gist.github.com/efann
  license:
    name: Eclipse Public License
    url: https://opensource.org/licenses/EPL-1.0
    gpl-compatible: true
  js:
    beo.routines/beo.routines.js: {}
  css:
    component:
      beo.routines/beo.style.css: {}

lightbox2:
  remote: https://lokeshdhakar.com/projects/lightbox2/
  license:
    name: MIT License
    url: https://lokeshdhakar.com/projects/lightbox2/#license
    gpl-compatible: true
  js:
    lightbox2-2.11.3/dist/js/lightbox.min.js: {}
  css:
    component:
      lightbox2-2.11.3/dist/css/lightbox.min.css: {}

parallax:
  remote: https://pixelcog.github.io/parallax.js/
  license:
    name: MIT License
    url: https://github.com/pixelcog/parallax.js/blob/master/LICENSE
    gpl-compatible: true
  js:
    parallax.js-1.5.0/parallax.min.js: {}

# routines.js needs to be loaded before the google maps api. That's
# why I place it in theme.files rather than under global-styling.
theme.files:
  js:
    js/routines.js: {}

global-loading:
  header: true
  css:
    theme:
       css/style.css: {}

  dependencies:
    - core/jquery
    - bstrap_child/jquery.ui
    - bstrap_child/beo.routines
    - bstrap_child/lightbox2
    - bstrap_child/parallax
    - bstrap_child/theme.files
